<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>电子宠物机 · 蹦跳双人</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #4a3f35 0%, #2c241e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', 'Press Start 2P', 'VT323', monospace;
      padding: 12px;
    }
    /* 电子宠物机外壳 */
    .pet-machine {
      width: 100%;
      max-width: 380px;
      background: #b7a99a;
      background-image: radial-gradient(circle at 20% 30%, #d8cec2 0%, #9b8b7c 90%);
      border-radius: 48px 48px 64px 64px;
      padding: 24px 16px 28px;
      box-shadow: 
        0 12px 0 #6b5e52,
        0 20px 30px rgba(0,0,0,0.6),
        inset 0 -4px 8px rgba(0,0,0,0.3),
        inset 0 6px 8px rgba(255,255,240,0.5);
      border: 2px solid #e2d7cb;
      position: relative;
      transition: transform 0.1s;
    }
    /* 顶部装饰按钮 */
    .machine-top-buttons {
      display: flex;
      justify-content: space-between;
      padding: 0 18px 10px;
      opacity: 0.8;
    }
    .machine-top-buttons span {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #5f4e3c;
      border-radius: 50%;
      box-shadow: inset 0 -2px 2px #2a1f16, 0 2px 2px #3f3228;
    }
    /* 屏幕区域 */
    .screen {
      background: #7b9e6b;
      background: linear-gradient(145deg, #6d8f5c, #4c6b3c);
      border-radius: 24px;
      padding: 20px 16px 16px;
      box-shadow: 
        inset 0 0 0 6px #3b4d2e,
        inset 0 0 0 10px #2a3a1e,
        0 8px 0 #3a2e23;
      border: 1px solid #96b382;
      position: relative;
      margin-bottom: 12px;
    }
    /* 像素感网格/反光 */
    .screen::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      border-radius: 24px;
    }
    /* 角色舞台 */
    .stage {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      min-height: 180px;
      position: relative;
      z-index: 2;
      padding: 0 4px;
      gap: 8px;
    }
    /* 单个角色容器 */
    .character-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s;
      flex: 1;
      max-width: 120px;
    }
    .character-wrapper:active {
      transform: scale(0.96);
    }
    /* 图片包裹层，用于蹦跳动画 */
    .bounce-box {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 90px;
      height: 90px;
      animation: bounce 1.2s infinite ease-in-out;
      transform-origin: center bottom;
    }
    .character-wrapper:nth-child(2) .bounce-box {
      animation-delay: 0.4s;
      animation-duration: 1.4s;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(-14px) scale(1.02, 0.98); }
      50% { transform: translateY(-18px) scale(0.98, 1.02); }
      70% { transform: translateY(-8px) scale(1.01, 0.99); }
    }
    /* 生气状态时动画更快更抖 */
    .character-wrapper.angry .bounce-box {
      animation: angryShake 0.25s infinite alternate;
    }
    @keyframes angryShake {
      0% { transform: translateY(-2px) rotate(-3deg); }
      100% { transform: translateY(2px) rotate(3deg); }
    }
    /* 角色图片 */
    .character-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 6px 0 rgba(0,0,0,0.2));
      transition: filter 0.2s;
      pointer-events: none;
      border-radius: 50%;
    }
    /* 生气时加红色滤镜 */
    .character-wrapper.angry .character-img {
      filter: drop-shadow(0 0 8px #ff4d4d) brightness(1.1) sepia(0.3) hue-rotate(-20deg);
    }
    /* 气泡对话框 */
    .speech-bubble {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-8px) scale(0.8);
      background: #fef9e7;
      color: #2d2d2d;
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 4px 0 #a09b8c, 0 8px 12px rgba(0,0,0,0.3);
      border: 2px solid #4a3f35;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 999;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.5px;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -8px;
      border: 8px solid transparent;
      border-top-color: #4a3f35;
    }
    .speech-bubble::before {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -6px;
      border: 6px solid transparent;
      border-top-color: #fef9e7;
      z-index: 1;
    }
    .speech-bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-16px) scale(1);
    }
    /* 生气图标装饰 */
    .anger-mark {
      position: absolute;
      top: -10px;
      right: -5px;
      font-size: 24px;
      opacity: 0;
      transition: opacity 0.2s;
      text-shadow: 0 2px 0 #8b0000;
      pointer-events: none;
    }
    .character-wrapper.angry .anger-mark {
      opacity: 1;
      animation: angerPop 0.3s infinite alternate;
    }
    @keyframes angerPop {
      from { transform: scale(0.9) rotate(-5deg); }
      to { transform: scale(1.2) rotate(5deg); }
    }

    /* 底部按钮区 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 18px;
      align-items: center;
      padding: 8px 10px 4px;
      background: #a39486;
      border-radius: 60px;
      box-shadow: inset 0 4px 6px #6b5b4e, 0 6px 0 #4d3f34;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .upload-btn {
      background: #d9cbbc;
      border: none;
      border-radius: 40px;
      padding: 12px 18px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      color: #2f2a24;
      font-size: 14px;
      box-shadow: 0 5px 0 #8f7e6e, 0 6px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: all 0.06s linear;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #efe6db;
      letter-spacing: 0.5px;
      touch-action: manipulation;
    }
    .upload-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #8f7e6e, 0 6px 10px rgba(0,0,0,0.2);
    }
    .upload-btn input {
      display: none;
    }
    .reset-btn {
      background: #cbb9a8;
      border: none;
      border-radius: 50px;
      padding: 12px 14px;
      font-size: 18px;
      box-shadow: 0 5px 0 #8f7e6e, 0 6px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: all 0.06s linear;
      color: #2f2a24;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .reset-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #8f7e6e, 0 6px 10px rgba(0,0,0,0.2);
    }

    /* 底部装饰 */
    .speaker-grill {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
      opacity: 0.7;
    }
    .speaker-grill div {
      width: 6px;
      height: 6px;
      background: #5a4d40;
      border-radius: 50%;
      box-shadow: inset 0 -1px 1px #2f251e;
    }

    /* 隐藏的文件输入 */
    #fileInput1, #fileInput2 {
      display: none;
    }
  </style>
</head>
<body>
<div class="pet-machine">
  <!-- 顶部装饰按钮 -->
  <div class="machine-top-buttons">
    <span></span><span></span><span></span>
  </div>

  <!-- 主屏幕 -->
  <div class="screen">
    <div class="stage" id="stage">
      <!-- 角色1 -->
      <div class="character-wrapper" id="char1Wrapper" data-id="1">
        <div class="speech-bubble" id="bubble1">你好呀~</div>
        <div class="anger-mark">💢</div>
        <div class="bounce-box">
          <img class="character-img" id="char1Img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23FFB347'/%3E%3Ccircle cx='35' cy='40' r='8' fill='%23333'/%3E%3Ccircle cx='65' cy='40' r='8' fill='%23333'/%3E%3Ccircle cx='35' cy='38' r='3' fill='white'/%3E%3Ccircle cx='65' cy='38' r='3' fill='white'/%3E%3Cpath d='M35 70 Q50 85 65 70' stroke='%23333' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" alt="角色1">
        </div>
      </div>
      <!-- 角色2 -->
      <div class="character-wrapper" id="char2Wrapper" data-id="2">
        <div class="speech-bubble" id="bubble2">嗨！</div>
        <div class="anger-mark">💢</div>
        <div class="bounce-box">
          <img class="character-img" id="char2Img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%237EC8C8'/%3E%3Ccircle cx='35' cy='40' r='8' fill='%23333'/%3E%3Ccircle cx='65' cy='40' r='8' fill='%23333'/%3E%3Ccircle cx='35' cy='38' r='3' fill='white'/%3E%3Ccircle cx='65' cy='38' r='3' fill='white'/%3E%3Cpath d='M35 70 Q50 85 65 70' stroke='%23333' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" alt="角色2">
        </div>
      </div>
    </div>
  </div>

  <!-- 控制区：上传图片、重置 -->
  <div class="controls">
    <button class="upload-btn" id="uploadBtn1">
      📷 角色1
      <input type="file" accept="image/*" id="fileInput1">
    </button>
    <button class="upload-btn" id="uploadBtn2">
      📷 角色2
      <input type="file" accept="image/*" id="fileInput2">
    </button>
    <button class="reset-btn" id="resetBtn" title="重置为默认形象">⟲</button>
  </div>

  <!-- 扬声器装饰 -->
  <div class="speaker-grill">
    <div></div><div></div><div></div><div></div><div></div>
  </div>
</div>

<script>
  (function(){
    // ---------- 角色状态管理 ----------
    const charWrappers = {
      1: document.getElementById('char1Wrapper'),
      2: document.getElementById('char2Wrapper')
    };
    const charImgs = {
      1: document.getElementById('char1Img'),
      2: document.getElementById('char2Img')
    };
    const bubbles = {
      1: document.getElementById('bubble1'),
      2: document.getElementById('bubble2')
    };

    // 每个角色的点击计数、生气阈值、气泡定时器
    const state = {
      1: { clickCount: 0, isAngry: false, bubbleTimer: null, angerTimer: null },
      2: { clickCount: 0, isAngry: false, bubbleTimer: null, angerTimer: null }
    };

    // 对话文案池
    const normalTexts = [
      '嘻嘻~', '你好呀！', '今天天气不错', '要一起玩吗？', 
      '啾啾~', '抱抱！', '(*^▽^*)', '你点我干嘛~'
    ];
    const angryTexts = [
      '别点了！', '生气了😠', '再点就咬你！', '哼！', 
      '烦死了！', '走开啦！', '💢💢💢', '不理你了！'
    ];

    // 生气阈值：点击多少次变生气
    const ANGRY_THRESHOLD = 4;
    // 生气后如果一段时间没点击，自动恢复
    const ANGER_COOLDOWN = 4000; // 4秒

    // ---------- 工具函数 ----------
    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // 显示气泡
    function showBubble(charId, text) {
      const bubble = bubbles[charId];
      if (!bubble) return;
      // 清除之前的定时器
      if (state[charId].bubbleTimer) {
        clearTimeout(state[charId].bubbleTimer);
        state[charId].bubbleTimer = null;
      }
      bubble.textContent = text;
      bubble.classList.add('show');
      // 2.2秒后自动隐藏
      state[charId].bubbleTimer = setTimeout(() => {
        bubble.classList.remove('show');
        state[charId].bubbleTimer = null;
      }, 2200);
    }

    // 设置生气状态
    function setAngry(charId, angry) {
      const wrapper = charWrappers[charId];
      const st = state[charId];
      if (!wrapper || !st) return;

      if (angry) {
        wrapper.classList.add('angry');
        st.isAngry = true;
        // 清除之前的恢复定时器
        if (st.angerTimer) {
          clearTimeout(st.angerTimer);
          st.angerTimer = null;
        }
        // 设定一段时间后自动消气
        st.angerTimer = setTimeout(() => {
          setAngry(charId, false);
          // 消气时重置点击计数
          st.clickCount = 0;
          // 可选：显示消气气泡
          showBubble(charId, '哼…原谅你了');
        }, ANGER_COOLDOWN);
      } else {
        wrapper.classList.remove('angry');
        st.isAngry = false;
        // 清除恢复定时器
        if (st.angerTimer) {
          clearTimeout(st.angerTimer);
          st.angerTimer = null;
        }
      }
    }

    // 处理角色点击
    function handleCharacterClick(charId) {
      const st = state[charId];
      if (!st) return;

      // 如果当前是生气状态，直接显示生气文本并重置计时器（延长生气）
      if (st.isAngry) {
        st.clickCount += 1; // 增加计数但无实际作用，仅保持
        showBubble(charId, getRandomItem(angryTexts));
        // 延长生气时间：重置angerTimer
        if (st.angerTimer) {
          clearTimeout(st.angerTimer);
        }
        st.angerTimer = setTimeout(() => {
          setAngry(charId, false);
          st.clickCount = 0;
          showBubble(charId, '哼…原谅你了');
        }, ANGER_COOLDOWN);
        return;
      }

      // 正常状态：增加点击计数
      st.clickCount += 1;

      // 判断是否达到生气阈值
      if (st.clickCount >= ANGRY_THRESHOLD) {
        // 生气！
        setAngry(charId, true);
        showBubble(charId, getRandomItem(angryTexts));
        // 注意：setAngry 里会设置 angerTimer，但我们需要保留点击计数直到消气重置
        // 不过 setAngry 中触发的恢复会重置点击计数，ok
        // 但这里还要保证生气时如果又点击会延长（上面已经处理）
      } else {
        // 正常显示对话
        showBubble(charId, getRandomItem(normalTexts));
      }
    }

    // ---------- 绑定点击事件（触摸+鼠标） ----------
    function bindCharacterEvents(charId) {
      const wrapper = charWrappers[charId];
      if (!wrapper) return;

      const clickHandler = (e) => {
        e.preventDefault();
        e.stopPropagation();
        handleCharacterClick(charId);
      };

      // 使用 touchstart 和 mousedown 兼容，避免延迟；用 pointerdown 更统一
      wrapper.addEventListener('pointerdown', clickHandler);
      // 防止移动端双击缩放（已在meta中禁止）
    }

    // 初始化两个角色的事件
    bindCharacterEvents(1);
    bindCharacterEvents(2);

    // ---------- 图片上传 ----------
    const fileInput1 = document.getElementById('fileInput1');
    const fileInput2 = document.getElementById('fileInput2');
    const uploadBtn1 = document.getElementById('uploadBtn1');
    const uploadBtn2 = document.getElementById('uploadBtn2');

    // 点击按钮触发文件选择
    uploadBtn1.addEventListener('click', (e) => {
      e.preventDefault();
      fileInput1.click();
    });
    uploadBtn2.addEventListener('click', (e) => {
      e.preventDefault();
      fileInput2.click();
    });

    // 处理文件选择
    function handleFileUpload(input, charId) {
      input.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          if (charImgs[charId]) {
            charImgs[charId].src = dataUrl;
          }
          // 保存到 localStorage
          try {
            localStorage.setItem(`pet_char_${charId}`, dataUrl);
          } catch (err) {
            console.warn('图片太大，无法保存到localStorage', err);
          }
        };
        reader.readAsDataURL(file);
        // 清空 input 值，以便再次选择同一文件也能触发 change
        input.value = '';
      });
    }

    handleFileUpload(fileInput1, 1);
    handleFileUpload(fileInput2, 2);

    // 加载时读取 localStorage 中的自定义图片
    function loadSavedImages() {
      [1, 2].forEach(charId => {
        try {
          const saved = localStorage.getItem(`pet_char_${charId}`);
          if (saved && charImgs[charId]) {
            charImgs[charId].src = saved;
          }
        } catch (err) { /* ignore */ }
      });
    }
    loadSavedImages();

    // ---------- 重置为默认形象 ----------
    const resetBtn = document.getElementById('resetBtn');
    resetBtn.addEventListener('click', () => {
      // 默认 SVG 数据
      const defaultSvg1 = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23FFB347'/%3E%3Ccircle cx='35' cy='40' r='8' fill='%23333'/%3E%3Ccircle cx='65' cy='40' r='8' fill='%23333'/%3E%3Ccircle cx='35' cy='38' r='3' fill='white'/%3E%3Ccircle cx='65' cy='38' r='3' fill='white'/%3E%3Cpath d='M35 70 Q50 85 65 70' stroke='%23333' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E";
      const defaultSvg2 = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%237EC8C8'/%3E%3Ccircle cx='35' cy='40' r='8' fill='%23333'/%3E%3Ccircle cx='65' cy='40' r='8' fill='%23333'/%3E%3Ccircle cx='35' cy='38' r='3' fill='white'/%3E%3Ccircle cx='65' cy='38' r='3' fill='white'/%3E%3Cpath d='M35 70 Q50 85 65 70' stroke='%23333' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E";
      
      charImgs[1].src = defaultSvg1;
      charImgs[2].src = defaultSvg2;
      
      // 移除保存的图片
      localStorage.removeItem('pet_char_1');
      localStorage.removeItem('pet_char_2');

      // 重置生气状态和计数
      [1, 2].forEach(charId => {
        setAngry(charId, false);
        state[charId].clickCount = 0;
        if (state[charId].bubbleTimer) {
          clearTimeout(state[charId].bubbleTimer);
          state[charId].bubbleTimer = null;
        }
        bubbles[charId].classList.remove('show');
      });
    });

    // 防止页面滑动/缩放干扰（可选）
    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.character-wrapper')) {
        e.preventDefault();
      }
    }, { passive: false });

    // 清理定时器（页面卸载时，可选）
    window.addEventListener('beforeunload', () => {
      [1, 2].forEach(charId => {
        if (state[charId].bubbleTimer) clearTimeout(state[charId].bubbleTimer);
        if (state[charId].angerTimer) clearTimeout(state[charId].angerTimer);
      });
    });

  })();
</script>
</body>
</html>
