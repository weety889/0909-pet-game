<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>电子宠物机 · mikoto &amp; john</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pet-machine">
  <div class="machine-header"></div>

  <div class="screen" id="screen">
    <div class="character" id="charA" data-name="mikoto">
      <div class="bubble" id="bubbleA">你好呀~</div>
      <div class="anger-mark">💢</div>
      <div class="bounce-inner">
        <img id="imgA" alt="mikoto">
      </div>
    </div>
    <div class="character" id="charB" data-name="john">
      <div class="bubble" id="bubbleB">嗨！</div>
      <div class="anger-mark">💢</div>
      <div class="bounce-inner">
        <img id="imgB" alt="john">
      </div>
    </div>
  </div>

  <div class="control-area">
    <div class="char-select-row">
      <button class="char-btn active" id="btnSelectA" data-target="A">mikoto</button>
      <button class="char-btn" id="btnSelectB" data-target="B">john</button>
    </div>

    <div class="bottom-row">
      <div class="dpad">
        <button class="up" data-dir="up">▲</button>
        <button class="left" data-dir="left">◀</button>
        <button class="down" data-dir="down">▼</button>
        <button class="right" data-dir="right">▶</button>
      </div>
      <button class="reset-btn" id="resetBtn">⟲ 重置</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
